<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"><title>二维码生成器闲鱼-老码仕途</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#f0f6ff;--primary:#2563eb;--primary-light:#3b82f6;--accent:#3b82f6;--accent-hover:#7c3aed;--accent-soft:#dbeafe;--success:#2563eb;--success-hover:#1d4ed8;--neutral:#64748b;--neutral-hover:#475569;--neutral-soft:#e2e8f0;--text-main:#1e293b;--text-soft:#475569;--text-muted:#94a3b8;--border:#cbd5e1;--border-focus:#3b82f6;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--shadow-sm:0 1px 3px rgba(37,99,235,0.05);--shadow-md:0 6px 20px-6px rgba(37,99,235,0.1);--shadow-lg:0 20px 40px-12px rgba(37,99,235,0.15)}html,body{height:100%;width:100%}body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);min-height:100vh;margin:0;color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column}.site-header{width:100%;background:linear-gradient(135deg,var(--primary),var(--accent-hover));color:white;padding:26px 40px;position:relative}.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;position:relative;z-index:1}.header-icon{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.25);border-radius:14px;font-size:1.4rem;flex-shrink:0;backdrop-filter:blur(4px)}.header-text h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;line-height:1.2;margin-bottom:2px}.header-text p{font-size:0.88rem;color:rgba(255,255,255,0.8);font-weight:400}.main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:32px 40px 64px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.block{background:white;border-radius:var(--radius-xl);padding:32px;box-shadow:var(--shadow-md);border:1px solid var(--border);display:flex;flex-direction:column;gap:24px}.block-title{font-size:0.78rem;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:10px;padding-bottom:4px}.block-title::before{content:'';display:inline-block;width:3px;height:14px;background:linear-gradient(to bottom,var(--accent),var(--primary-light));border-radius:3px}.input-field{display:flex;flex-direction:column;gap:8px}.input-field label{font-size:0.82rem;font-weight:600;color:var(--text-soft);letter-spacing:0.3px}.input-field textarea{width:100%;min-height:120px;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:0.95rem;font-family:inherit;color:var(--text-main);background:#fafcfd;transition:all 0.2s ease;outline:none;resize:vertical;line-height:1.6}.input-field textarea:focus{border-color:var(--border-focus);background:white;box-shadow:0 0 0 4px rgba(41,168,196,0.1)}.input-field textarea::placeholder{color:var(--text-muted)}.options{display:flex;flex-direction:column;gap:22px}.option-block{display:flex;flex-direction:column;gap:10px}.option-label{font-size:0.82rem;font-weight:600;color:var(--text-soft);display:flex;align-items:center;justify-content:space-between;letter-spacing:0.3px}.option-label.value{font-size:0.82rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;background:var(--accent-soft);padding:2px 10px;border-radius:100px}input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--border);border-radius:4px;outline:none;cursor:pointer}input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:white;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(41,168,196,0.3);cursor:pointer;transition:transform 0.15s}input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:white;border:3px solid var(--accent);box-shadow:0 2px 8px rgba(41,168,196,0.3);cursor:pointer}.color-pair{display:flex;align-items:center;gap:20px;flex-wrap:wrap}.color-item{display:flex;align-items:center;gap:10px;flex:1;min-width:130px}input[type="color"]{-webkit-appearance:none;appearance:none;width:44px;height:44px;border:2px solid var(--border);border-radius:var(--radius-md);cursor:pointer;padding:3px;background:white;transition:all 0.2s;flex-shrink:0}input[type="color"]::-webkit-color-swatch-wrapper{padding:0}input[type="color"]::-webkit-color-swatch{border:none;border-radius:8px}input[type="color"]::-moz-color-swatch{border:none;border-radius:8px}input[type="color"]:hover{border-color:var(--accent);transform:scale(1.04)}.color-info{display:flex;flex-direction:column;gap:2px;min-width:0}.color-info.name{font-size:0.78rem;color:var(--text-soft);font-weight:500}.color-info.hex{font-size:0.82rem;color:var(--text-main);font-weight:600;font-family:'SF Mono','Monaco','Consolas',monospace;text-transform:uppercase;letter-spacing:0.3px}.button-group{display:flex;gap:12px;flex-wrap:wrap}.btn{flex:1;min-width:100px;padding:15px 20px;border:none;border-radius:var(--radius-md);font-size:0.95rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:0.2px;white-space:nowrap}.btn:active:not(:disabled){transform:scale(0.98)}.btn:disabled{opacity:0.45;cursor:not-allowed}.btn-generate{background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:white;box-shadow:0 6px 16px-6px rgba(41,168,196,0.5);flex:1.4}.btn-generate:hover:not(:disabled){background:linear-gradient(135deg,var(--accent-hover),var(--primary));transform:translateY(-2px);box-shadow:0 10px 22px-8px rgba(41,168,196,0.6)}.btn-clear{background:var(--neutral-soft);color:var(--neutral);border:1.5px solid var(--border);flex:0.6}.btn-clear:hover:not(:disabled){background:#dde5e9;color:var(--neutral-hover);border-color:#c5d3da}.preview-block{position:sticky;top:32px;display:flex;flex-direction:column;gap:20px}.preview-header{display:flex;align-items:center;justify-content:space-between}.preview-title{font-size:0.78rem;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:10px}.preview-title::before{content:'';display:inline-block;width:3px;height:14px;background:linear-gradient(to bottom,var(--accent),var(--primary-light));border-radius:3px}.preview-status{font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:6px;font-weight:500}.preview-status.dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);transition:all 0.3s}.preview-status.active.dot{background:var(--success);box-shadow:0 0 0 3px rgba(46,139,108,0.15)}.preview-stage{display:flex;justify-content:center;align-items:center;min-height:380px;padding:28px;background:#f9fbfc;border-radius:var(--radius-lg);border:1.5px dashed var(--border);transition:all 0.3s ease;position:relative;overflow:hidden}.preview-stage.has-qr{background:white;border-style:solid;border-color:var(--border)}.preview-stage canvas,.preview-stage img{display:block;max-width:100%;height:auto;border-radius:var(--radius-md);animation:qrReveal 0.4s cubic-bezier(0.34,1.56,0.64,1)}@keyframes qrReveal{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}.preview-empty{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--text-muted);font-size:0.9rem;text-align:center}.preview-empty svg{width:60px;height:60px;opacity:0.35;color:var(--accent)}.btn-download-full{width:100%;padding:16px 20px;background:linear-gradient(135deg,var(--success),var(--success-hover));color:white;border:none;border-radius:var(--radius-md);font-size:0.95rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px-6px rgba(46,139,108,0.5)}.btn-download-full:hover:not(:disabled){background:linear-gradient(135deg,var(--success-hover),var(--primary));transform:translateY(-2px);box-shadow:0 10px 22px-8px rgba(46,139,108,0.6)}.btn-download-full:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none}.site-footer{text-align:center;padding:24px;font-size:0.8rem;color:var(--text-muted)}.site-footer.dot{margin:0 8px;opacity:0.5}@media(max-width:900px){.layout{grid-template-columns:1fr;gap:24px}.preview-block{position:static}.preview-stage{min-height:320px}}@media(max-width:640px){.site-header{padding:20px 20px}.header-icon{width:42px;height:42px;font-size:1.2rem;border-radius:12px}.header-text h1{font-size:1.25rem}.header-text p{font-size:0.82rem}.main{padding:20px 16px 48px}.block{padding:22px 18px;border-radius:var(--radius-lg)}.color-pair{flex-direction:column;align-items:stretch;gap:14px}.color-item{min-width:0}.button-group{flex-direction:column}.btn{width:100%;flex:1}.preview-stage{min-height:260px;padding:20px}.preview-empty svg{width:48px;height:48px}}@media(max-width:380px){.site-header{padding:18px 16px}.header-text h1{font-size:1.1rem}.block{padding:18px 14px}input[type="color"]{width:40px;height:40px}}@media(hover:none){.btn-generate:hover:not(:disabled),.btn-download-full:hover:not(:disabled),.btn-clear:hover:not(:disabled){transform:none}input[type="range"]::-webkit-slider-thumb:hover{transform:none}input[type="color"]:hover{transform:none}}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c5d8e0;border-radius:10px}</style></head><body><!--=====Header=====--><header class="site-header"><div class="header-inner"><div class="header-icon">▣</div><div class="header-text"><h1>二维码生成器</h1><p>快速将文本、网址或任何信息转换为二维码</p></div></div></header><!--=====主内容=====--><main class="main"><div class="layout"><!--左侧：配置区--><div class="block"><div class="block-title">输入文本或URL</div><!--输入--><div class="input-field"><textarea id="qrText"placeholder="在此粘贴或输入内容，例如：https://example.com"spellcheck="false"></textarea></div><!--选项--><div class="options"><!--尺寸--><div class="option-block"><div class="option-label"><span>二维码大小</span><span class="value"id="sizeValue">220px</span></div><input type="range"id="sizeSlider"min="120"max="400"value="220"step="10"></div><!--颜色--><div class="option-block"><div class="option-label"><span>二维码颜色</span></div><div class="color-pair"><div class="color-item"><input type="color"id="fgColor"value="#000000"><div class="color-info"><span class="name">前景</span><span class="hex"id="fgHex">#000000</span></div></div><div class="color-item"><input type="color"id="bgColor"value="#ffffff"><div class="color-info"><span class="name">背景</span><span class="hex"id="bgHex">#FFFFFF</span></div></div></div></div></div><!--按钮--><div class="button-group"><button class="btn btn-generate"id="generateBtn"><span>⚡</span>生成二维码</button><button class="btn btn-clear"id="clearBtn"><span>✕</span>清空</button></div></div><!--右侧：预览区--><div class="block preview-block"><div class="preview-header"><div class="preview-title">预览</div><div class="preview-status"id="previewStatus"><span class="dot"></span><span id="statusText">等待生成</span></div></div><div class="preview-stage"id="previewStage"><div class="preview-empty"><svg viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="1.2"><rect x="3"y="3"width="7"height="7"rx="1.5"/><rect x="14"y="3"width="7"height="7"rx="1.5"/><rect x="3"y="14"width="7"height="7"rx="1.5"/><rect x="14"y="14"width="7"height="7"rx="1.5"/></svg><span>二维码将显示在这里</span></div></div><button class="btn-download-full"id="downloadBtn"disabled><span>↓</span>下载二维码PNG</button></div></div></main><!--=====页脚=====--><footer class="site-footer"><span class="dot">·</span>数据不出本地<span class="dot">·</span>完全免费</footer><script>(function(){'use strict';const DEFAULTS={size:220,fg:'#000000',bg:'#ffffff'};const qrText=document.getElementById('qrText');const sizeSlider=document.getElementById('sizeSlider');const sizeValue=document.getElementById('sizeValue');const fgColor=document.getElementById('fgColor');const fgHex=document.getElementById('fgHex');const bgColor=document.getElementById('bgColor');const bgHex=document.getElementById('bgHex');const generateBtn=document.getElementById('generateBtn');const downloadBtn=document.getElementById('downloadBtn');const clearBtn=document.getElementById('clearBtn');const previewStage=document.getElementById('previewStage');const previewStatus=document.getElementById('previewStatus');const statusText=document.getElementById('statusText');let currentQrElement=null;let debounceTimer=null;function updateSizeDisplay(){sizeValue.textContent=sizeSlider.value+'px'}function updateColorDisplays(){fgHex.textContent=fgColor.value.toUpperCase();bgHex.textContent=bgColor.value.toUpperCase()}function setStatus(text,active){statusText.textContent=text;if(active){previewStatus.classList.add('active')}else{previewStatus.classList.remove('active')}}function resetPreview(){previewStage.innerHTML=`<div class="preview-empty"><svg viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="1.2"><rect x="3"y="3"width="7"height="7"rx="1.5"/><rect x="14"y="3"width="7"height="7"rx="1.5"/><rect x="3"y="14"width="7"height="7"rx="1.5"/><rect x="14"y="14"width="7"height="7"rx="1.5"/></svg><span>二维码将显示在这里</span></div>`;previewStage.classList.remove('has-qr');currentQrElement=null;downloadBtn.disabled=true;setStatus('等待生成',false)}function generateQr(){const text=qrText.value.trim();if(!text){qrText.focus();setStatus('请输入内容',false);return}if(typeof QRCode==='undefined'){alert('二维码库未加载，请检查网络后刷新');return}const size=parseInt(sizeSlider.value,10);const fg=fgColor.value;const bg=bgColor.value;previewStage.innerHTML='';previewStage.classList.add('has-qr');const qrContainer=document.createElement('div');qrContainer.style.display='flex';qrContainer.style.justifyContent='center';qrContainer.style.alignItems='center';previewStage.appendChild(qrContainer);try{new QRCode(qrContainer,{text:text,width:size,height:size,colorDark:fg,colorLight:bg,correctLevel:QRCode.CorrectLevel.H});const canvas=qrContainer.querySelector('canvas');const img=qrContainer.querySelector('img');if(canvas){currentQrElement=canvas;downloadBtn.disabled=false;setStatus('生成成功',true)}else if(img){currentQrElement=img;downloadBtn.disabled=false;setStatus('生成成功',true)}else{setTimeout(()=>{const c=qrContainer.querySelector('canvas');const i=qrContainer.querySelector('img');if(c){currentQrElement=c;downloadBtn.disabled=false;setStatus('生成成功',true)}else if(i){currentQrElement=i;downloadBtn.disabled=false;setStatus('生成成功',true)}else{setStatus('生成失败',false);downloadBtn.disabled=true}},50)}}catch(err){console.error('生成失败:',err);alert('生成二维码失败，请重试');resetPreview()}}function debouncedGenerate(){clearTimeout(debounceTimer);debounceTimer=setTimeout(generateQr,120)}function downloadQr(){if(!currentQrElement){alert('请先生成二维码');return}const link=document.createElement('a');link.download='qrcode_'+Date.now()+'.png';if(currentQrElement.tagName==='CANVAS'){link.href=currentQrElement.toDataURL('image/png')}else if(currentQrElement.tagName==='IMG'){link.href=currentQrElement.src}else{return}document.body.appendChild(link);link.click();document.body.removeChild(link)}function clearAll(){qrText.value='';resetPreview();qrText.focus()}generateBtn.addEventListener('click',generateQr);downloadBtn.addEventListener('click',downloadQr);clearBtn.addEventListener('click',clearAll);qrText.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();generateQr()}});sizeSlider.addEventListener('input',function(){updateSizeDisplay();if(currentQrElement){debouncedGenerate()}});fgColor.addEventListener('input',function(){updateColorDisplays();if(currentQrElement){debouncedGenerate()}});bgColor.addEventListener('input',function(){updateColorDisplays();if(currentQrElement){debouncedGenerate()}});function init(){updateSizeDisplay();updateColorDisplays();setTimeout(generateQr,150)}if(document.readyState==='complete'){init()}else{window.addEventListener('load',init)}})();</script></body></html>
